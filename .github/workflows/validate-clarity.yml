name: Validate Clarity JavaScript and section routes
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax-and-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check client JavaScript syntax
        run: |
          for file in app.js navigation.js completion.js capture.js reversibility.js home.js; do
            node --check "$file"
          done
      - name: Validate routing wrappers and identifiers
        run: node tests/section-routes.cjs
