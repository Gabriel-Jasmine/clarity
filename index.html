<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Clarity is a guided decision-thinking tool for consequential choices where there is no obvious right answer.">
<title>Clarity — Guided Decision Thinking</title>
<link rel="stylesheet" href="styles.css?v=20261007-incentives">
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><strong>Clarity</strong><small>Think clearly. Choose deliberately.</small></div>
    <button id="mobileNavToggle" class="secondary" aria-expanded="false" aria-controls="nav">Sections</button><nav id="nav" aria-label="Decision sections"></nav><p class="storage-note">Saved in this browser</p>
    <button id="reset" class="secondary">New decision</button>
  </aside>
  <main>
    <header><div><div class="eyebrow">CLARITY / GUIDED DECISION THINKING</div><h1 id="title"></h1></div><span class="saved" id="stepCount"></span></header>
    <div class="progress"><i id="bar"></i></div>
    <section id="screen"></section>
    <footer><button id="back" class="secondary">← Back</button><button id="next">Continue →</button></footer>
  </main>
</div>
<script src="app.js?v=20261007-incentives"></script>
</body>
</html>
