<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Clarity is a guided decision-thinking tool for consequential choices where there is no obvious right answer.">
<title>Clarity — Guided Decision Thinking</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><strong>Clarity</strong><small>For consequential choices that can meaningfully affect your life, work, relationships, or future direction.</small></div>
    <nav id="nav"></nav>
    <button id="reset" class="secondary">New decision</button>
  </aside>
  <main>
    <header><div><div class="eyebrow">CLARITY / GUIDED DECISION THINKING</div><h1 id="title"></h1></div><span class="saved">Saved locally</span></header>
    <div class="progress"><i id="bar"></i></div>
    <section id="screen"></section>
    <footer><button id="back" class="secondary">← Back</button><button id="next">Continue →</button></footer>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
