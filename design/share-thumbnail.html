<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Clarity — Share image source</title>
<style>
:root{color-scheme:light;--share-canvas:#FAF4E4;--share-ink:#20211F;--share-pink:#EDBDDF}
*{box-sizing:border-box}
body{margin:0;background:var(--share-canvas)}
.share-image{width:1200px;height:630px;position:relative;overflow:hidden;background:var(--share-canvas);color:var(--share-ink)}
.share-image img{position:absolute;top:0;left:324px;width:552px;height:auto;display:block;mix-blend-mode:multiply}
.share-headline{position:absolute;top:428.4px;left:60px;right:60px;margin:0;text-align:center;font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:72px;line-height:1.07;letter-spacing:-.025em;color:var(--share-ink)}
.share-headline>span{display:block}
.share-underlined{text-decoration-line:underline;text-decoration-color:var(--share-pink);text-decoration-thickness:.14em;text-underline-offset:.03em;text-decoration-skip-ink:none}
</style>
</head>
<body>
<main class="share-image" aria-label="Clarity share image">
<img src="../assets/clarity-galaxy.png" width="1448" height="1086" alt="A person rests beneath a galaxy of connected thoughts.">
<h1 class="share-headline"><span>A good decision</span><span>begins with <span class="share-underlined">Clarity</span></span></h1>
</main>
</body>
</html>
